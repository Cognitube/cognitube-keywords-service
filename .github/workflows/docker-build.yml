name: Docker Build and Push

on:
    push:
        branches:
            - '**'

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        environment: production
        steps:
            - name: Check Out Repo
              uses: actions/checkout@v2

            - name: Log in to Docker Hub
              uses: docker/login-action@v1
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v1

            - name: Lowercase branch name
              id: ref
              run: echo "::set-output name=branch::$(echo ${GITHUB_REF#refs/heads/} | awk '{print tolower($0)}')"

            - name: Build and Push Docker image
              uses: docker/build-push-action@v2
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: |
                      haozhealexzhang/cognitube-ai-service:${{ steps.ref.outputs.branch }}
                      ${{ github.ref == 'refs/heads/main' && 'haozhealexzhang/cognitube-ai-service:latest' || '' }}

            - name: Clean up Post Run
              run: docker rmi haozhealexzhang/cognitube-ai-service:${{ steps.ref.outputs.branch }} haozhealexzhang/cognitube-ai-service:latest
